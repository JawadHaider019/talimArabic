<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142642"/>
      <stop offset="100%" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="50%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#B38634"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Interlocking Rub el Hizb 8-pointed star -->
  <rect x="19" y="19" width="26" height="26" rx="4" stroke="url(#gold)" stroke-width="2.6"/>
  <rect x="19" y="19" width="26" height="26" rx="4" transform="rotate(45 32 32)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.6"/>
  <!-- Center radiant star dot -->
  <circle cx="32" cy="32" r="4.5" fill="url(#gold)"/>
</svg>
